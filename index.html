<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover lets the layout extend under the iOS home indicator;
         styles.css then pays it back with safe-area padding. user-scalable=no
         stops the double-tap zoom that makes bottom sheets feel broken. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta name="theme-color" content="#f8f5ef" />
    <meta name="description" content="Stake USDC with a friend and prove the friendship." />

    <!-- Installable web app: runs fullscreen from the home screen, no app store. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SocialTrust" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="application-name" content="SocialTrust" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />

    <meta property="og:title" content="SocialTrust" />
    <meta property="og:description" content="Stake USDC with a friend and prove the friendship." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <title>SocialTrust</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
